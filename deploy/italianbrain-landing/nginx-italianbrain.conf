# italianbrain.it — landing statica servita dal container nginx di Axon Core (docker-compose in /opt/axon-core).
# File destinazione: /opt/axon-core/nginx/conf.d/italianbrain.conf   (installato da issue_ssl_vps.sh)
# Requisiti: volume  /var/www/italianbrain:/var/www/italianbrain:ro  nel servizio nginx di docker-compose.yml
#            certificato Let's Encrypt UNICO (italianbrain.it + www + core.italianbrain.it) in ./nginx/certs/{fullchain,privkey}.pem
#            → stesso file usato da axon-core.conf: un solo rinnovo per tutti i domini.

# --- HTTP :80 → ACME challenge (webroot condiviso ./nginx/www) + redirect a HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name italianbrain.it www.italianbrain.it;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://italianbrain.it$request_uri; }
}

# --- HTTPS :443 www → apex (un solo URL canonico) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.italianbrain.it;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    return 301 https://italianbrain.it$request_uri;
}

# --- HTTPS :443 → landing statica ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name italianbrain.it;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /var/www/italianbrain;
    index index.html;

    gzip on;
    gzip_types text/html text/css image/svg+xml application/javascript;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /index.html { add_header Cache-Control "no-cache"; }

    # V50.z536 — anteprima OG DINAMICA (logo + «posti Founder rimasti», rigenerata ogni notte dal backend Axon Core, stesso docker-compose)
    location = /og-preview.png {
        proxy_pass http://axon_core/api/public/og-preview.png;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @og_static;
        expires 1h; add_header Cache-Control "public, max-age=3600";
    }
    location @og_static { try_files /og-preview.png =404; }   # fallback: PNG statico del pacchetto se il backend è giù

    # V50.z546 — pagine di approfondimento /axonos e /advisoros: i testi arrivano dal CMS (GET /api/public/landing/page/<slug>)
    # tramite proxy same-origin verso il backend Axon Core (stesso docker-compose). Solo endpoint PUBBLICI, nessuna auth.
    location ^~ /api/public/ {
        proxy_pass http://axon_core/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store";
    }

    location ~* \.(css|svg|png|jpg|webp|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location ~* \.js$ { add_header Cache-Control "no-cache"; }
    location = /axonos    { try_files /axonos.html =404; add_header Cache-Control "no-cache"; }
    location = /advisoros { try_files /advisoros.html =404; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
