# italianbrain.it — landing statica (nginx). Copia in /etc/nginx/conf.d/ (o sites-available) e poi: nginx -t && systemctl reload nginx
# Certificato: certbot --nginx -d italianbrain.it -d www.italianbrain.it
server {
    listen 80;
    listen [::]:80;
    server_name italianbrain.it www.italianbrain.it;
    root /var/www/italianbrain;
    index index.html;

    gzip on;
    gzip_types text/html text/css image/svg+xml application/javascript;
    gzip_min_length 512;

    location = /index.html { add_header Cache-Control "no-cache"; }

    # V50.z536 — anteprima OG DINAMICA (logo + «posti Founder rimasti», rigenerata ogni notte dal backend Axon Core).
    # Caso A (default): questo file è dentro ./nginx/conf.d del docker-compose di axon-core → il backend è raggiungibile come axon-core:8001
    location = /og-preview.png {
        proxy_pass http://axon-core:8001/api/public/og-preview.png;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @og_static;
        expires 1h; add_header Cache-Control "public, max-age=3600";
    }
    # Caso B: nginx sull'host (fuori da Docker) → sostituisci la proxy_pass con https://TUO_DOMINIO_CORE/api/public/og-preview.png
    location @og_static { try_files /og-preview.png =404; }   # fallback: PNG statico del pacchetto se il backend è giù

    location ~* \.(css|svg|png|jpg|webp|ico)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
