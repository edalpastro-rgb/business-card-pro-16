# nginx/conf.d/axon-core.conf — reverse proxy HTTPS per Axon Core
# Sostituisci CORE_DOMAIN con il dominio (es. core.advisoros.it) oppure lascia l'IP 80.211.27.80 con certificato autofirmato.

# Upstream FastAPI (rete interna docker)
upstream axon_core {
    server axon-core:8001;
    keepalive 32;
}

# Limiti upload: registrazioni ANT / materiali corsi fino a 200 MB (come il limite lato app)
client_max_body_size 220m;

# --- HTTP :80 → ACME challenge + redirect a HTTPS ---
server {
    listen 80;
    server_name 80.211.27.80 CORE_DOMAIN;

    location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS :443 → Axon Core ---
server {
    listen 443 ssl;
    http2 on;
    server_name 80.211.27.80 CORE_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Header di sicurezza
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Tutte le API di Core stanno sotto /api (stessa convenzione dell'ambiente Emergent)
    location /api/ {
        proxy_pass http://axon_core;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streaming SSE di Axon (/api/assistant/chat/stream): niente buffering, timeout lunghi
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout  900s;   # LLM, Whisper su audio lunghi, export ZIP
        proxy_send_timeout  900s;
        proxy_connect_timeout 30s;
        chunked_transfer_encoding on;
    }

    # Root: AdvisorOS web (export Expo SPA in ./web, montato su /usr/share/nginx/html).
    # Ogni percorso non-file (es. /wake-training, /public-review/xyz) ricade su index.html → expo-router gestisce la rotta.
    root /usr/share/nginx/html;
    index index.html;

    location = /axon-core-status { return 200 "Axon Core online\n"; add_header Content-Type text/plain; }

    # Bundle JS/asset con hash nel nome: cache lunga
    location ~* ^/(_expo|assets)/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
