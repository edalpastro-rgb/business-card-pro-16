# docker-compose.yml — Axon Core su VPS (80.211.27.80)
# Servizi: axon-core-a / axon-core-b (FastAPI :8001, blue-green, solo rete interna) · mongodb (volume persistente) · clamav ·
#          nginx (reverse proxy HTTPS :443, HTTP :80 → redirect + ACME; upstream attivo in nginx/conf.d/00-upstream.conf)
# Avvio: `docker compose up -d --build mongodb clamav axon-core-a nginx`   ·   Deploy/aggiornamento: `bash upgrade_vps.sh` (mai `up -d` di entrambi i colori)
# Log: `docker compose logs -f axon-core-a` (o -b: vedi 00-upstream.conf per il colore attivo)

name: axon-core

# ── V50.z570 — BLUE-GREEN: due container identici (axon-core-a / axon-core-b). Nginx punta SEMPRE a quello attivo tramite
# nginx/conf.d/00-upstream.conf (generato da upgrade_vps.sh). Il deploy installa il nuovo pacchetto nel container INATTIVO,
# lo smoke gate lo testa dall'interno (4 classi, TTFT < 2 s), poi nginx viene ricaricato (reload graceful, zero downtime)
# sul nuovo container; se il gate fallisce il nuovo container viene distrutto e gli utenti restano su quello attivo.
# Memoria: i due container coesistono solo per i minuti del deploy (il vecchio viene fermato dopo lo switch).
x-axon-env: &axon-env   # V50.z579 — variabili comuni ai due colori (AXON_COLOR aggiunto per servizio: annuncio deploy in chat)
  # MONGO_URL costruito dalle credenziali root del servizio mongodb (sovrascrive quello del .env se presente)
  MONGO_URL: mongodb://${MONGO_ROOT_USER:-axon}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${DB_NAME:-axon_core}?authSource=admin
  DB_NAME: ${DB_NAME:-axon_core}
  PORT: "8001"
  # V50.z469 — Feature 15: antivirus ClamAV (servizio `clamav` qui sotto). CLAMAV_REQUIRED=1 → upload rifiutati se l'AV non risponde.
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-0}

x-axon-core: &axon-core
  build:
    context: ./backend            # la cartella backend/ di Core copiata sul VPS (con Dockerfile e .dockerignore dentro)
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  environment: *axon-env
  volumes:
    - core_uploads:/app/backend/uploads        # file locali (fallback quando Object Storage non è configurato)
    - core_tmp:/tmp                            # temp ffmpeg / Whisper / ZIP export
    - core_kb:/app/backend/data                # V50.z529 — ChromaDB: Knowledge Base personale (vettori per utente)
  depends_on:
    mongodb:
      condition: service_healthy
    clamav:
      condition: service_started               # le firme si scaricano al primo avvio (~2-5 min): nel frattempo fail-open (log) salvo CLAMAV_REQUIRED=1
  expose:
    - "8001"
  # Sblocca SOLO per debug locale (raggiungibile su http://IP:8001 senza HTTPS):
  # ports:
  #   - "8001:8001"
  deploy:
    resources:
      limits:
        memory: 2048m            # VPS 4 GB: ~2 GB a Core, ~0.9 GB a Mongo, ~1 GB a ClamAV (V50.z469), resto a nginx/OS
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  networks: [axon]

services:
  mongodb:
    image: mongo:7
    container_name: axon-mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.75"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-axon}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Imposta MONGO_ROOT_PASSWORD nel file .env}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [axon]
    # Nessuna porta esposta all'esterno: MongoDB è raggiungibile solo da axon-core.

  axon-core-a:
    <<: *axon-core
    image: axon-core:a
    container_name: axon-core-a
    environment:
      <<: *axon-env
      AXON_COLOR: a
  axon-core-b:
    <<: *axon-core
    image: axon-core:b
    container_name: axon-core-b
    environment:
      <<: *axon-env
      AXON_COLOR: b

  # V50.z469 — Feature 15: antivirus ClamAV (clamd su TCP 3310, solo rete interna; firme aggiornate da freshclam ogni ora)
  clamav:
    image: clamav/clamav:stable
    container_name: axon-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav_db:/var/lib/clamav                # database firme persistente (evita il download completo ad ogni riavvio)
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1024m            # clamd carica le firme in RAM (~0.8-1 GB)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [axon]

  nginx:
    image: nginx:1.27-alpine
    container_name: axon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro           # fullchain.pem + privkey.pem (Let's Encrypt o autofirmato — vedi guida)
      - ./nginx/www:/var/www/certbot                # ACME http-01 challenge
      - ./web:/usr/share/nginx/html:ro               # AdvisorOS web (export Expo) — link pubblici /wake-training, /public-review, desktop
      - /var/www/italianbrain:/var/www/italianbrain:ro   # V50.z538 — landing italianbrain.it (HTTPS, stesso certificato SAN)
    # V50.z571 — NESSUN depends_on sul backend: in blue-green il container attivo cambia (axon-core-a|b) e nginx deve partire
    # indipendentemente dal colore (un depends_on su entrambi li avvierebbe tutti e due = 4 GB). L'upstream attivo è deciso da
    # nginx/conf.d/00-upstream.conf (upgrade_vps.sh); al reboot `restart: unless-stopped` riprova finché il backend è risolvibile.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [axon]

volumes:
  mongo_data:
  mongo_config:
  core_uploads:
  core_tmp:
  clamav_db:                 # V50.z469 — firme ClamAV
  core_kb:                   # V50.z529 — ChromaDB Knowledge Base personale

networks:
  axon:
    driver: bridge
